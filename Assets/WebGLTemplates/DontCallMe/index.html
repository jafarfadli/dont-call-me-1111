<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Don't Call Me!</title>
    <style>
      /* The game fills the frame it is given (itch.io sets the size and has its own fullscreen button). */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #17141C; }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #17141C; outline: none; }
      #loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 320px; max-width: 70%;
                 font: 700 18px/1.4 "Helvetica Neue", Arial, sans-serif; letter-spacing: 2px; color: #F4EAD2; text-align: center; }
      #loading-track { margin-top: 14px; height: 14px; border: 3px solid #F4EAD2; border-radius: 10px; padding: 2px; }
      #loading-fill { height: 100%; width: 0; background: #E2574C; border-radius: 6px; }
      #loading-note { margin-top: 12px; font-size: 13px; font-weight: 400; letter-spacing: 0; display: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <div>DON'T CALL ME!</div>
      <div id="loading-track"><div id="loading-fill"></div></div>
      <div id="loading-note"></div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var loading = document.querySelector("#loading");
      var fill = document.querySelector("#loading-fill");
      var note = document.querySelector("#loading-note");

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }, function (progress) {
        fill.style.width = Math.round(progress * 100) + "%";
      }).then(function () {
        loading.style.display = "none";
      }).catch(function (message) {
        note.style.display = "block";
        note.textContent = String(message);
      });
    </script>
  </body>
</html>
